name: Pull request checks
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
permissions:
  contents: read

jobs:
  quality_profile:
    name: Compile, test, and analyze
    runs-on: ubuntu-latest

    # GitHub does not provide repository secrets to workflows from forks.
    # Skip this private-dependency job for fork-originated pull requests.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "17"
          cache: maven

      # This must run after setup-java because setup-java can create
      # or replace ~/.m2/settings.xml.
      - name: Configure LOC Maven access
        uses: bcgov/ols-util/.github/actions/setup-loc-maven@v1
        with:
          artifactory-username: ${{ secrets.LOC_ARTIFACTORY_USERNAME }}
          artifactory-password: ${{ secrets.LOC_ARTIFACTORY_PASSWORD }}

      - name: Compile and run unit tests
        run: mvn --batch-mode --update-snapshots test

      - name: Set up JDK 21 for Sonar
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
          overwrite-settings: false

      - name: Cache Sonar packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: Run Sonar Analysis
        run: mvn sonar:sonar
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}
          -Dsonar.host.url=${{ vars.SONAR_HOST_URL }}
          -Dsonar.organization=${{ vars.SONAR_ORG }}
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
        env:
          GITHUB_TOKEN: ${{ github.token }}