# =============================================================================
# Spectral Ruleset for ols-geocoder
# =============================================================================
# Extends the BC Government itk-api-governance strict ruleset (which encodes
# the Basic OpenAPI Style Guide) and adds SDX API Standard validation rules.
#
# Guides:
#   https://developer.gov.bc.ca/docs/default/component/api-style-guides/basic-style-guide/
#   https://developer.gov.bc.ca/docs/default/component/api-style-guides/sdx-style-guide/
# Ruleset: https://github.com/bcgov/itk-api-governance/tree/main/dist/spectral
# =============================================================================

extends:
  - https://raw.githubusercontent.com/bcgov/itk-api-governance/main/dist/spectral/strict-ruleset.yaml

rules:

  # ==========================================================================
  # BC Government itk-api-governance: soften strict rules for initial adoption
  # ==========================================================================
  # These rules are set to 'warn' to allow incremental improvement.
  # Tighten to 'error' as the API spec matures.

  operation-description-min-length: warn
  info-description-min-length: warn
  operation-description: warn
  info-description: warn
  tag-description: warn
  oas3-parameter-description: warn
  oas3_0-schema-requires-example: warn
  oas3_1-schema-requires-example: warn
  operation-summary: warn
  path-item-summary: warn

  # The generated spec currently emits terse response descriptions ("OK"),
  # JTS geometry schemas without descriptions, and two non-camelCase
  # operationIds. Warn until the OpenAPI generator is improved.
  response-description-min-length: warn
  schema-description: warn
  schema-description-min-length: warn
  operation-id-camel-case: warn

  # ==========================================================================
  # SDX API Standard - Mandatory Rules (severity: error)
  # ==========================================================================
  # These rules enforce MUST/SHALL requirements from the SDX API Standard.

  # SDX: OAD must use OpenAPI 3.x or newer. Swagger 2.0 is not supported.
  sdx-oas3-required:
    description: >-
      SDX requires OpenAPI 3.x or newer. Swagger 2.0 is not supported
      for SDX provisioning.
    message: "SDX requires OpenAPI 3.x. Swagger 2.0 is not supported."
    severity: error
    given: $
    then:
      field: openapi
      function: pattern
      functionOptions:
        match: ^3\.\d+\.\d+$

  # SDX: No path-item-level servers.
  sdx-no-path-item-servers:
    description: >-
      SDX does not support path-item-level servers.
      Server URLs must be declared at the document root only.
    message: "SDX forbids path-item-level servers."
    severity: error
    given: $.paths.*.servers
    then:
      function: falsy

  # SDX: No operation-level servers.
  sdx-no-operation-servers:
    description: >-
      SDX does not support operation-level servers.
      Server URLs must be declared at the document root only.
    message: "SDX forbids operation-level servers."
    severity: error
    given: $.paths.*.*.servers
    then:
      function: falsy

  # SDX: Server URLs must use HTTP, HTTPS, or relative URLs.
  sdx-server-url-scheme:
    description: >-
      SDX server URLs must use HTTP, HTTPS, or relative URLs.
      WebSocket, FTP, SFTP, MQTT, AMQP and other schemes are forbidden.
    message: "SDX server URL must use http://, https://, or a relative path. Found: {{value}}"
    severity: error
    given: $.servers[*].url
    then:
      function: pattern
      functionOptions:
        match: "^(https?://|/)"

  # SDX: No long-lived streaming media types.
  sdx-no-streaming-media-types:
    description: >-
      SDX does not support long-lived streaming media types such as
      server-sent events or stream-framed JSON payloads.
    message: "SDX forbids streaming media type '{{value}}'."
    severity: error
    given:
      - $.paths.*.*.responses.*.content
      - $.paths.*.*.requestBody.content
    then:
      field: '@key'
      function: pattern
      functionOptions:
        notMatch: "^(text/event-stream|text/event-flow|application/stream\\+json|application/x-ndjson)$"

  # SDX: No TRACE operations.
  sdx-no-trace:
    description: "SDX does not allow TRACE operations."
    message: "SDX does not allow TRACE operations."
    severity: error
    given: $.paths.*.trace
    then:
      function: falsy

  # SDX: No OPTIONS operations.
  sdx-no-options:
    description: "SDX does not allow OPTIONS operations."
    message: "SDX does not allow OPTIONS operations."
    severity: error
    given: $.paths.*.options
    then:
      function: falsy

  # SDX: No HEAD operations.
  sdx-no-head:
    description: "SDX does not allow HEAD operations."
    message: "SDX does not allow HEAD operations."
    severity: error
    given: $.paths.*.head
    then:
      function: falsy

  # SDX: No cookie parameters.
  sdx-no-cookie-parameters:
    description: "SDX does not support cookie parameters."
    message: "SDX forbids cookie parameters."
    severity: error
    given: $.paths.*.*.parameters[?(@.in == 'cookie')]
    then:
      function: falsy

  # SDX: No webhooks at document level (OAS 3.1).
  sdx-no-webhooks:
    description: >-
      SDX does not support top-level webhooks (OAS 3.1).
      The OAD must not define asynchronous or event-driven features.
    message: "SDX forbids top-level webhooks."
    severity: error
    given: $.webhooks
    then:
      function: falsy

  # SDX: No operation-level callbacks.
  sdx-no-callbacks:
    description: >-
      SDX does not support operation-level callbacks.
      The OAD must not define asynchronous or event-driven features.
    message: "SDX forbids operation-level callbacks."
    severity: error
    given: $.paths.*.*.callbacks
    then:
      function: falsy

  # SDX: No internal edge headers in the external contract.
  # Forbids X-Edge-Token and any other X-Edge-* header declared as an
  # operation parameter...
  sdx-no-internal-headers:
    description: >-
      The external API contract must not expose SDX internal transport details.
      X-Edge-Token and any other X-Edge-* header must not be included in the OAD.
    message: "SDX forbids internal edge header '{{value}}' in the external API contract."
    severity: error
    given: $.paths.*.*.parameters[?(@.in == 'header')].name
    then:
      function: pattern
      functionOptions:
        notMatch: "(?i)^x-edge-"

  # Same prohibition for response header declarations.
  sdx-no-internal-response-headers:
    description: >-
      The external API contract must not expose SDX internal transport details.
      X-Edge-* response headers must not be included in the OAD.
    message: "SDX forbids internal edge response header '{{value}}'."
    severity: error
    given: $.paths.*.*.responses.*.headers
    then:
      field: '@key'
      function: pattern
      functionOptions:
        notMatch: "(?i)^x-edge-"

  # SDX: All operations must have an operationId.
  sdx-operation-operationid:
    description: >-
      SDX requires operation IDs for all operations to enable
      consistent API cataloguing and client generation.
    message: "Operation is missing an operationId (required by SDX)."
    severity: error
    given: $.paths.*.*[get,post,put,patch,delete]
    then:
      field: operationId
      function: truthy

  # SDX: No query strings in path keys.
  sdx-path-not-include-query:
    description: >-
      SDX requires that path keys must not include query strings.
      Query parameters must be documented as OpenAPI parameters.
    message: "Path key must not include query strings (required by SDX)."
    severity: error
    given: $.paths
    then:
      field: "@key"
      function: pattern
      functionOptions:
        notMatch: "\\?"

  # ==========================================================================
  # SDX API Standard - Recommended Rules (severity: warn)
  # ==========================================================================
  # These rules enforce SHOULD/RECOMMENDED requirements from the SDX API Standard.

  # SDX: OAuth2 security scheme required for SDX Gateway authorization.
  # The guide mandates at least one OAuth2 securityScheme defining gateway
  # scopes (sdx-oauth2-security-schemes, ERROR). Kept at 'warn' for now:
  # this API currently documents an apiKey scheme for gateway access;
  # escalate to 'error' once the contract migrates to SDX OAuth2
  # client-credentials authorization. Full scope validation (consistent
  # scope descriptions across flows, per-operation effective security) is
  # available in the upstream SDX ruleset and requires custom functions.
  sdx-oauth2-security-scheme:
    description: >-
      SDX Gateway authorization must be documented with at least one OAuth2
      security scheme because the contract must explicitly define the
      relevant gateway scopes. OpenID Connect schemes should not be the
      primary scheme for SDX Gateway authorization.
    message: "No OAuth2 security scheme found; SDX Gateway authorization should be documented with an OAuth2 scheme."
    severity: warn
    given: $.components.securitySchemes.*
    then:
      field: type
      function: pattern
      functionOptions:
        match: ^oauth2$

  # SDX: Security declarations should reference the security scheme.
  sdx-security-declaration:
    description: >-
      SDX APIs should use security declarations to identify the SDX Gateway
      OAuth2 scheme and any scopes required to access operations.
    message: >-
      Consider adding global or operation-level security declarations
      for SDX Gateway authorization.
    severity: warn
    given: $
    then:
      field: security
      function: truthy
